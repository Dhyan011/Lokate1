services:
  - type: web
    name: lokate-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.db.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lokate-db
          property: connectionString
      - key: PYTHONPATH
        value: .

  - type: web
    name: lokate-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://lokate-backend.onrender.com" # Assuming default Render slug, you might need to update this after backend deploys!

databases:
  - name: lokate-db
    plan: free
    databaseName: lokate
    user: lokate_user
