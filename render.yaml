services:
  # PostgreSQL Database
  - type: psql
    name: lokate-db
    plan: free # Note: Render will use the free tier if available on your account

  # Backend FastAPI Service
  - type: web
    name: lokate-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lokate-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: lokate-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        fromService:
          type: web
          name: lokate-backend
          property: host
